model_list:
  # Anthropic Models
  - model_name: claude-opus-4
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  # OpenAI Models
  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # Gemini Models
  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

  # Local: Ollama (configure OLLAMA_BASE_URL, e.g. http://bytebot-ollama:11434)
  - model_name: ollama-llama3.1-8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: os.environ/OLLAMA_BASE_URL

  # Local: Generic OpenAI-compatible endpoint (e.g., FastAPI following OpenAI spec)
  # Set LOCAL_OPENAI_BASE to http://your-fastapi:8000/v1 and, if needed, LOCAL_OPENAI_API_KEY
  # 
  # IMPORTANT: Model selection affects reasoning parameter support:
  # - For NON-reasoning models: Use gpt-4o, gpt-4, gpt-3.5-turbo, etc.
  # - For REASONING models: Use o1-mini, o1-preview, o3-mini, etc.
  # The ProxyService automatically detects reasoning models (starting with 'o') and includes reasoning_effort parameter
  - model_name: local-openai-compat
    litellm_params:
      model: openai/gpt-4o  # Use gpt-4o for non-reasoning. Change to openai/o1-mini for reasoning models
      api_base: os.environ/LOCAL_OPENAI_BASE
      api_key: os.environ/LOCAL_OPENAI_API_KEY

  # VLLM: Local VLLM models via FastAPI (OpenAI-compatible)
  # Set VLLM_BASE_URL to your VLLM FastAPI endpoint (e.g., http://localhost:8000/v1)
  # VLLM models will be dynamically discovered from the /v1/models endpoint

litellm_settings:
  drop_params: true
